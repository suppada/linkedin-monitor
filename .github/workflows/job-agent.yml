name: DevOps Job AI Agent

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devops-job-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore seen-job database
        uses: actions/cache/restore@v5
        with:
          path: data/email-display-test.db
          key: email-display-test-state-${{ github.run_id }}
          restore-keys: email-display-test-state-

      - name: Install agent
        run: python -m pip install .

      - name: Find new jobs and email matches
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: job-agent --config config.json --state data/email-display-test.db

      - name: Save seen-job database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/email-display-test.db
          key: email-display-test-state-${{ github.run_id }}

