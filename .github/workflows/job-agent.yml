name: DevOps Job AI Agent

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devops-job-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-job database
        uses: actions/cache/restore@v4
        with:
          path: data/company-careers-v15.db
          key: company-careers-v15-state-${{ github.run_id }}
          restore-keys: company-careers-v15-state-

      - name: Install agent
        run: python -m pip install .

      - name: Find new jobs and email matches
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: job-agent --config config.json --state data/company-careers-v15.db

      - name: Save seen-job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/company-careers-v15.db
          key: company-careers-v15-state-${{ github.run_id }}

