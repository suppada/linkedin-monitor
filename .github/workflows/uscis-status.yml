name: USCIS I-140 Status Monitor

on:
  schedule:
    # Run hourly, 11 minutes after the hour
    - cron: "11 * * * *"

  workflow_dispatch:
    inputs:
      notify_initial:
        description: "Send current status as a test email"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uscis-status-monitor
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore previous USCIS status
        uses: actions/cache/restore@v5
        with:
          path: data/uscis-status.json
          key: uscis-status-${{ github.run_id }}
          restore-keys: |
            uscis-status-

      - name: Install USCIS monitor
        run: python -m pip install .

      - name: Check official USCIS case status
        env:
          USCIS_RECEIPT_NUMBER: ${{ secrets.USCIS_RECEIPT_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          NOTIFY_INITIAL: ${{ inputs.notify_initial }}
        run: |
          if [ "$NOTIFY_INITIAL" = "true" ]; then
            uscis-monitor \
              --state data/uscis-status.json \
              --notify-initial
          else
            uscis-monitor \
              --state data/uscis-status.json
          fi

      - name: Save current USCIS status
        if: success()
        uses: actions/cache/save@v5
        with:
          path: data/uscis-status.json
          key: uscis-status-${{ github.run_id }}
