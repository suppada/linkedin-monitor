[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-job-agent"
version = "1.0.0"
description = "Independent AI agent that finds new DevOps jobs and emails Gmail alerts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Suresh Kumar Uppada"}]
dependencies = []

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_agent = ["data/*.json"]

